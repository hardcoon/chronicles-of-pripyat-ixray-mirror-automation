name: Mirror release assets to Gitea

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation (plan, <=256 MiB segment probe, or mirror)
        required: true
        default: plan
        type: choice
        options:
          - plan
          - probe-first-segment
          - mirror
      verify_existing_sha:
        description: Download and hash every existing immutable package
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: chronicles-of-pripyat-gitea-release-mirror
  cancel-in-progress: false

jobs:
  plan:
    # A dispatch from another ref is intentionally inert. The exact main SHA is
    # checked out without credentials, and this job never receives GITEA_TOKEN.
    if: >-
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       vars.GITEA_MIRROR_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      source_manifest_sha256: ${{ steps.bind_source.outputs.manifest_sha256 }}
      source_launcher_size: ${{ steps.bind_source.outputs.launcher_size }}
      source_launcher_sha256: ${{ steps.bind_source.outputs.launcher_sha256 }}
    steps:
      - name: Check out trusted mirror automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Plan manifest-selected assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_VERIFY_EXISTING_SHA: ${{ inputs.verify_existing_sha }}
        shell: bash
        run: |
          set -euo pipefail
          operation="${INPUT_OPERATION:-mirror}"
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            operation="mirror"
          fi
          args=(
            --github-repo hardcoon/chronicles-of-pripyat-ixray
            --github-tag dev-2026.08.26.1
            --gitea-url https://gitea.com
            --gitea-repo hardcoon/chronicles-of-pripyat-ixray-downloads
            --gitea-tag dev-channel
            --dry-run
            --plan-out "$RUNNER_TEMP/gitea-mirror-plan.json"
          )
          case "$operation" in
            plan|mirror) ;;
            probe-first-segment) args+=(--probe-largest-full) ;;
            *) echo "Unsupported operation: $operation" >&2; exit 2 ;;
          esac
          if [[ "$INPUT_VERIFY_EXISTING_SHA" == "true" ]]; then
            args+=(--verify-existing-sha)
          fi
          python mirror_release_assets.py "${args[@]}"

      - name: Bind write job to the planned source assets
        id: bind_source
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/gitea-mirror-plan.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys

          plan_path, output_path = sys.argv[1:]
          with open(plan_path, encoding="utf-8") as stream:
              source = json.load(stream)["source"]
          manifest_sha = source["canonicalManifestSha256"]
          launcher_size = source["launcherSize"]
          launcher_sha = source["launcherSha256"]
          if not isinstance(manifest_sha, str) or not re.fullmatch(
              r"[0-9a-f]{64}", manifest_sha
          ):
              raise SystemExit("planned manifest SHA-256 is invalid")
          if (
              isinstance(launcher_size, bool)
              or not isinstance(launcher_size, int)
              or launcher_size <= 0
          ):
              raise SystemExit("planned launcher size is invalid")
          if not isinstance(launcher_sha, str) or not re.fullmatch(
              r"[0-9a-f]{64}", launcher_sha
          ):
              raise SystemExit("planned launcher SHA-256 is invalid")
          with open(output_path, "a", encoding="utf-8") as stream:
              stream.write(f"manifest_sha256={manifest_sha}\n")
              stream.write(f"launcher_size={launcher_size}\n")
              stream.write(f"launcher_sha256={launcher_sha}\n")
          PY

      - name: Save reviewed plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitea-mirror-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gitea-mirror-plan.json
          if-no-files-found: warn
          retention-days: 30

  write:
    needs: plan
    # Gitea writes are possible only for the exact main workflow revision and
    # only through the protected gitea-production Environment secret.
    if: >-
      needs.plan.result == 'success' &&
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' &&
        inputs.operation != 'plan' &&
        vars.GITEA_MIRROR_WRITE_ENABLED == 'true') ||
       (github.event_name == 'schedule' &&
        vars.GITEA_MIRROR_WRITE_ENABLED == 'true' &&
        vars.GITEA_MIRROR_SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: gitea-production
    steps:
      - name: Check out the planned main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Mirror manifest-selected assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_VERIFY_EXISTING_SHA: ${{ inputs.verify_existing_sha }}
          EXPECTED_SOURCE_MANIFEST_SHA256: ${{ needs.plan.outputs.source_manifest_sha256 }}
          EXPECTED_SOURCE_LAUNCHER_SIZE: ${{ needs.plan.outputs.source_launcher_size }}
          EXPECTED_SOURCE_LAUNCHER_SHA256: ${{ needs.plan.outputs.source_launcher_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          operation="${INPUT_OPERATION:-mirror}"
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            operation="mirror"
          fi
          args=(
            --github-repo hardcoon/chronicles-of-pripyat-ixray
            --github-tag dev-2026.08.26.1
            --gitea-url https://gitea.com
            --gitea-repo hardcoon/chronicles-of-pripyat-ixray-downloads
            --gitea-tag dev-channel
            --expected-source-manifest-sha256 "$EXPECTED_SOURCE_MANIFEST_SHA256"
            --expected-source-launcher-size "$EXPECTED_SOURCE_LAUNCHER_SIZE"
            --expected-source-launcher-sha256 "$EXPECTED_SOURCE_LAUNCHER_SHA256"
            --plan-out "$RUNNER_TEMP/gitea-mirror-write-plan.json"
            --receipt-out "$RUNNER_TEMP/gitea-mirror-receipt.json"
          )
          case "$operation" in
            probe-first-segment) args+=(--probe-largest-full) ;;
            mirror) ;;
            *) echo "Unsupported operation: $operation" >&2; exit 2 ;;
          esac
          if [[ "$INPUT_VERIFY_EXISTING_SHA" == "true" ]]; then
            args+=(--verify-existing-sha)
          fi
          python mirror_release_assets.py "${args[@]}"

      - name: Save write receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitea-mirror-write-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gitea-mirror-write-plan.json
            ${{ runner.temp }}/gitea-mirror-receipt.json
          if-no-files-found: warn
          retention-days: 30
